<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt; height: 405pt;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #FEFEF9;
    overflow: hidden;
    position: relative;
  }
  .rule-top { position: absolute; top: 0; left: 0; width: 720pt; height: 4pt; background: #C8000A; }
  .bg-num p { font-family: Georgia, serif; font-size: 220pt; font-weight: 700; color: #C8000A; opacity: 0.06; line-height: 1; }
  .badge { position: absolute; top: 40pt; left: 52pt; background: #C8000A; padding: 5pt 12pt; }
  .badge p { font-size: 10pt; font-weight: 700; letter-spacing: 0.1em; color: #FFFFFF; text-transform: uppercase; }
  .h2-block { position: absolute; top: 76pt; left: 52pt; width: 560pt; }
  .h2-block h2 { font-family: Georgia, "Times New Roman", serif; font-size: 27pt; font-weight: 700; color: #1A1A1A; line-height: 1.3; }
  .rule-mid { position: absolute; top: 130pt; left: 52pt; width: 300pt; height: 1pt; background: #DDDDDD; }
  .bullets { position: absolute; top: 153pt; left: 52pt; width: 500pt; }
  .bullets ul { list-style: none; }
  .bullets li { font-size: 13pt; color: #333333; line-height: 1.9; padding-left: 18pt; position: relative; margin-bottom: 4pt; }
  .bullets li::before { content: "—"; position: absolute; left: 0; color: #C8000A; }
  .note-box { position: absolute; top: 235pt; left: 52pt; width: 500pt; border-left: 3pt solid #C8000A; padding-left: 16pt; }
  .note-box p { font-family: Georgia, serif; font-size: 13pt; font-style: italic; color: #555555; line-height: 1.6; }
</style>
</head>
<body>
  <div class="rule-top"></div>

  <div class="bg-num" style="position:absolute; top:-20pt; right:20pt;"><p>03</p></div>

  <div class="badge"><p>第三名</p></div>
  <div class="h2-block"><h2>Custom Universe：一张手机照片，变成机器人的训练场</h2></div>
  <div class="rule-mid"></div>

  <div class="bullets">
    <ul>
      <li>手机拍一张照片，实时变成可编辑的 3D 场景</li>
      <li>给需要合成训练数据的机器人实验室使用</li>
    </ul>
  </div>

  <div class="note-box">
    <p>三个获奖作品里，最贴近产业落地的一个——直接服务于机器人实验室的真实需求</p>
  </div>
</body>
</html>
