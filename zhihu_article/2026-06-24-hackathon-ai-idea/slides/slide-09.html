<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt; height: 405pt;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #FEFEF9;
    overflow: hidden;
    position: relative;
  }
  .rule-top { position: absolute; top: 0; left: 0; width: 720pt; height: 4pt; background: #C8000A; }
  .h1-block { position: absolute; top: 130pt; left: 52pt; width: 616pt; }
  .h1-block h1 { font-family: Georgia, "Times New Roman", serif; font-size: 42pt; font-weight: 700; color: #1A1A1A; line-height: 1.2; }
  .deck { position: absolute; top: 225pt; left: 52pt; width: 560pt; }
  .deck p { font-family: Georgia, serif; font-size: 15pt; font-style: italic; color: #555555; line-height: 1.7; }
  .rule-bottom { position: absolute; bottom: 56pt; left: 52pt; width: 616pt; height: 1pt; background: #DDDDDD; }
  .ref { position: absolute; bottom: 30pt; left: 52pt; }
  .ref p { font-size: 9.5pt; color: #999999; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="rule-top"></div>

  <div class="h1-block"><h1>你的 idea，够不够野？</h1></div>

  <div class="deck">
    <p>AI 已经把「不会写代码」的门拆掉了。门后面是什么，看你脑子里那个别人没想到、而且值得做出来的东西。</p>
  </div>

  <div class="rule-bottom"></div>
  <div class="ref">
    <p>参考资料：Meet the winners of our Claude Opus 4.8 Build Day hackathon — claude.com/blog</p>
  </div>
</body>
</html>
