<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt; height: 405pt;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #FEFEF9;
    overflow: hidden;
    position: relative;
  }
  .rule-top { position: absolute; top: 0; left: 0; width: 720pt; height: 4pt; background: #C8000A; }
  .mark { position: absolute; top: 46pt; left: 52pt; }
  .mark p { font-family: Georgia, serif; font-size: 80pt; font-weight: 700; color: #C8000A; opacity: 0.5; line-height: 1; }
  .quote { position: absolute; top: 110pt; left: 60pt; width: 600pt; }
  .quote p { font-family: Georgia, serif; font-size: 30pt; font-weight: 700; font-style: italic; color: #1A1A1A; line-height: 1.4; }
  .attr { position: absolute; top: 255pt; left: 60pt; }
  .attr p { font-size: 12pt; letter-spacing: 0.04em; color: #C8000A; font-weight: 700; }
  .rule-mid { position: absolute; top: 288pt; left: 60pt; width: 300pt; height: 1pt; background: #DDDDDD; }
  .support { position: absolute; top: 304pt; left: 60pt; width: 560pt; }
  .support p { font-size: 12.5pt; color: #555555; line-height: 1.7; }
</style>
</head>
<body>
  <div class="rule-top"></div>

  <div class="mark"><p>“</p></div>

  <div class="quote">
    <p>用 Claude 来帮你选工具，而不只是帮你写代码。</p>
  </div>

  <div class="attr"><p>— 第三名 Custom Universe 团队</p></div>
  <div class="rule-mid"></div>

  <div class="support">
    <p>代码只是最末端的执行。往上一层，是选什么工具、搭什么架构；再往上一层，是到底要做一件什么事。</p>
  </div>
</body>
</html>
