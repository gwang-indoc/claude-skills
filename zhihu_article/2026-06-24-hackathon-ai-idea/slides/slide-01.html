<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt; height: 405pt;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #FEFEF9;
    overflow: hidden;
    position: relative;
  }
  .rule-top { position: absolute; top: 0; left: 0; width: 720pt; height: 4pt; background: #C8000A; }
  .masthead-row { position: absolute; top: 28pt; left: 52pt; right: 52pt; }
  .pub-label p { font-size: 10pt; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #C8000A; }
  .edition p { font-size: 10pt; letter-spacing: 0.04em; color: #999999; text-align: right; }
  .rule-mid { position: absolute; top: 60pt; left: 52pt; width: 616pt; height: 1pt; background: #DDDDDD; }
  .title-block { position: absolute; top: 130pt; left: 52pt; right: 52pt; }
  .title-block h1 { font-family: Georgia, "Times New Roman", serif; font-size: 46pt; font-weight: 700; color: #1A1A1A; line-height: 1.15; letter-spacing: -0.01em; }
  .deck { position: absolute; top: 250pt; left: 52pt; width: 560pt; }
  .deck p { font-family: Georgia, serif; font-size: 16pt; font-style: italic; color: #555555; line-height: 1.6; }
  .rule-bottom { position: absolute; bottom: 56pt; left: 52pt; width: 616pt; height: 1pt; background: #DDDDDD; }
  .byline { position: absolute; bottom: 30pt; left: 52pt; }
  .byline p { font-size: 10pt; letter-spacing: 0.05em; color: #888888; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="rule-top"></div>

  <div class="masthead-row pub-label" style="width: 300pt;">
    <p>AI × HACKATHON</p>
  </div>
  <div class="masthead-row edition" style="left: 372pt;">
    <p>2026.06.13 · 旧金山</p>
  </div>

  <div class="rule-mid"></div>

  <div class="title-block">
    <h1>Hackathon 变天了</h1>
  </div>

  <div class="deck">
    <p>以前拼手速，现在拼想法——Claude Opus 4.8 Build Day Hackathon 揭示的新规则</p>
  </div>

  <div class="rule-bottom"></div>
  <div class="byline">
    <p>根据 Claude Opus 4.8 Build Day Hackathon 获奖案例观察</p>
  </div>
</body>
</html>
